# zizmor's ignore ledger -- the DEBT, written down rather than absorbed.
#
# The gate runs `--persona=pedantic`, which is stricter than the findings
# this repository is obliged to fix: pedantic reports code smells, and a
# smell is a claim about how a file will age rather than about how it
# behaves today. Running it anyway is the point. Conforming to the stricter
# reading is what produces the more pristine workflow, and an entry below is
# the price of NOT conforming, stated once and in the open.
#
# WHAT AN ENTRY MEANS: this finding is real, it is understood, and it is not
# being fixed for a reason that outlives the person who wrote it down. What
# it does NOT mean is that the finding is wrong. A false positive belongs
# upstream as a bug report, not here.
#
# EVERY ENTRY CARRIES ITS EXIT. An ignore with no stated condition for its
# own removal is indistinguishable from one nobody ever revisits, which is
# how a debt register becomes a wall of noise (`.:V74`: a constraint no check reads is a
# comment, and an exemption with no exit is the same sentence pointing the
# other way).
#
# LINE NUMBERS ARE PART OF THE MATCH, so an entry that drifts stops
# suppressing and the finding returns. That is a feature -- it forces a
# re-read whenever the surrounding job moves -- but it means editing a
# workflow above one of these entries can turn the gate red without anything
# being wrong. When that happens the fix is to update the number here after
# confirming the reason still holds, not to reach for a broader pattern.
#
# EMPTY BY MEASUREMENT, 2026-09-09, and that is a fact about this tree rather
# than about the ledger. Pedantic reported nine findings on first run --
# three `excessive-permissions`, three `artipacked`, one `template-injection`
# and two `anonymous-definition` -- and all nine were fixed. The two that
# `itok` carries as debt are the `anonymous-definition` pair, which it cannot
# pay off because `main`'s branch protection there names twelve required
# checks after the contexts its jobs generate, so a `name:` strands the
# branch unmergeable. `sherd` has no required status checks and no rulesets
# (`gh api repos/pr0d1r2/sherd/branches/main/protection` -- checked, not
# assumed), so naming the jobs cost nothing and the entries were never
# opened. The file stays because the mechanism is what is being installed:
# the next finding this repo declines has a place to be written down, with
# its reason and its exit, instead of being argued about in a review.
rules: {}
