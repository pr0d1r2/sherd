[package]
name = "bbx-cli"
version = "0.1.0"
edition = "2021"
# MSRV tracks the deps: itok and microlith both pin 1.82.
rust-version = "1.82"
license = "MIT"
description = "two-axis federation of SPEC.md and source over a dir DAG, for small-context local models"

# R8: crates.io `bbx` is taken (BBCode parser, lib-only). The BIN name is
# verified free on brew, debian and PATH, so the package is renamed and the
# binary is not.
[[bin]]
name = "bbx"
path = "src/main.rs"

[lib]
name = "bbx"
path = "src/lib.rs"

[features]
# Default ON because `tdd` is the point of installing; `--no-default-features`
# still yields the deterministic, networkless core that §C demands (parse,
# DAG, budget, ceiling -- none of which may call a model).
default = ["ollama"]
ollama = ["dep:ureq", "dep:serde_json"]

[dependencies]
# V72: these are named ONLY inside their facade module -- src/tokens/,
# src/spec/, src/ollama/. Everything else goes through the facade, and module
# privacy makes the compiler enforce it (error[E0603]).
itok = { path = "../itok", default-features = false, features = ["bpe"] }
microlith = { path = "../microlith" }
# ureq with default-features off = no TLS stack. ollama is plain http on the
# LAN: no cloud, no cert chain, no ring/openssl. Same choice itok made.
ureq = { version = "2.12", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[lints.rust]
unsafe_code = "forbid"
