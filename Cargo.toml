# One PUBLISHED crate, and one member that is never published. §C says "one
# crate" and this is the amendment to it: `dev/` holds tooling that maintains
# THIS repository -- it reads our files and writes our docs, and a consumer of
# `sherd` has no use for any of it. A second `[[bin]]` here would have
# shipped in the tarball and landed on their PATH. A workspace member with
# `publish = false` cannot, and needs no `cfg` gate or `exclude` entry kept in
# sync to stay out.
[workspace]
members = ["dev"]

[package]
name = "sherd"
version = "0.5.0-rc.1"
edition = "2024"
# MSRV tracks the FLEET PIN, which is what actually compiles this: nixpkgs-lock
# follows nixos-26.05, and that ships rustc 1.95.0. The siblings pin 1.96 --
# the rev this repo used to name -- so today they are ABOVE the toolchain the
# fleet standard provides. Edition 2024 is native from 1.85, so it costs the
# floor nothing.
rust-version = "1.95"
license = "MIT"
description = "two-axis federation of SPEC.md and source over a dir DAG, for small-context local models"
repository = "https://github.com/pr0d1r2/sherd"
homepage = "https://github.com/pr0d1r2/sherd"
documentation = "https://docs.rs/sherd"
readme = "README.md"
keywords = ["spec", "llm", "context", "codegen", "local"]
categories = ["command-line-utilities", "development-tools"]
# Dev-only machinery, meaningless to a consumer of the crate.
exclude = [
  "flake.nix",
  "flake.lock",
  ".envrc",
  ".githooks",
  ".context-limits",
  ".sherd-state",
  ".sherd-slices",
  # The gate: its ops and the pkl schema they amend. Same class as `.githooks`
  # above -- it runs on THIS working tree and means nothing inside a published
  # tarball. `pkl/Config.pkl` alone is a 1,014-line vendored schema.
  "hk.pkl",
  "pkl",
  # Agent tooling for THIS repo; a consumer has no use for our commands.
  ".claude",
  # `nix build` leaves `result` as a symlink to the store path, and cargo
  # packages whatever git does not ignore: the dry run shipped an 8.8 MB
  # binary built on THIS machine inside the crate. Ignored in git as well,
  # so the two agree.
  "result",
  "result-*",
]

[[bin]]
name = "sherd"
path = "src/main.rs"

[lib]
name = "sherd"
path = "src/lib.rs"

[features]
# EMPTY by default, so `cargo install sherd` builds the deterministic core and
# nothing else: no HTTP client, no TLS stack, no network code at all in the
# binary a consumer gets.
#
# It was `["ollama"]`, on the reasoning that `tdd` is the point of installing.
# The ladder says otherwise now (V117): the mechanical surface ships at `0.5`
# and the model half resumes at `0.7`, so the default has to be the half that
# is being published. A default carrying an endpoint client into every install
# would make the featureless build the corner case and the network build the
# norm -- exactly backwards for a tool whose §C says the core may never call a
# model.
#
# `ollama` is one flag away, and `sherd` says so when a verb needs it rather
# than reporting an unknown command.
default = []
ollama = ["dep:ureq", "dep:serde_json"]

[dependencies]
# V72: these are named ONLY inside their facade module -- src/tokens/,
# src/spec/, src/ollama/. Everything else goes through the facade, and module
# privacy makes the compiler enforce it (error[E0603]).
itok = { version = "0.3", default-features = false, features = ["bpe"] }
# Both are public -- crates.io, github.com/pr0d1r2/{itok,microlith} -- so both
# are registry deps and a clean clone builds with no sibling checkout. `itok`
# was the last path dep in the tree (T71): a path dep is a shared working tree,
# so the gate's green expired silently whenever the sibling moved, which is B5.
# A registry version plus the lock checksum is an immutable artifact instead
# (V101), and the runner in `src/lib.rs` now allows no exceptions at all.
microlith = "0.6"
# ureq 3 with `rustls`, so `SHERD_ENDPOINT` may be an `https://` host. What
# gets POSTed is the PROMPT -- slices of your spec and your source, because
# feeding a repository to a model is the whole job -- and `ollama` is a
# DEFAULT feature, so plaintext would be the default path rather than an
# opt-in one. Same fix itok took, for the same reason and with the same
# surprise: moving 2 -> 3 to gain TLS made the tree smaller, since ureq 2
# dragged in url -> idna -> the ICU stack.
ureq = { version = "3", default-features = false, features = [
  "rustls",
], optional = true }
serde_json = { version = "1", optional = true }

[lints.rust]
unsafe_code = "forbid"

# The thresholds live in `clippy.toml`; these denies are what make them fire.
# `too_many_lines`, `cognitive_complexity` and `excessive_nesting` are
# pedantic/nursery lints, silent by default -- a threshold with no deny is a
# number nothing reads, which is `.:V74` in a config file.
#
# `warn`, not `deny`, and the reason is the ratchet rather than softness.
#
# MEASURED at adoption: 288 violations -- 83 structural, 198 safety. Denying
# outright makes the tree not compile, which blocks every other task and
# cannot even be counted; a blanket `allow` is the reflex `clippy.toml` says
# these limits exist to catch. So the lints warn, `.lint-debt` records the
# count, and the GATE fails when the count rises.
#
# That keeps `.:B6`'s rule intact -- a check that cannot fail is no check --
# because the thing that can fail is the ratchet, not clippy. A lint flips to
# `deny` individually the moment its debt reaches zero.
[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
# A panic in a tool that runs unattended is a run that stops with no record.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
# A stub that compiles is the failure mode this repo has recorded three times.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
